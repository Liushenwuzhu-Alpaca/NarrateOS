id: sensory-grounding
name: 具象感官锚定
version: "1.0.0"
description: 引导规划与执笔阶段通过可感知的物理细节、环境声响、光影明暗与器物触感承载人物状态与场景张力
applicable_roles:
  - planner
  - writer
prompt_injection: |
  [文风插件: 具象感官锚定]
  - 场域落地: 每个场景开篇先确立至少两项可验证的物理锚点(光线角度、空气温湿度、材质触感或环境声源), 使人物行动依托真实空间动线展开。
  - 情绪外化: 将内在心理波动转译为与周围器物、光线或动作节奏的交互变化, 让读者通过具体动作与物理反馈自行推断人物处境。
  - 感官切换: 随场景推进交替调用视觉焦距、听觉远近与触觉反馈, 保持画面层次与现场临场感。
enabled: true
