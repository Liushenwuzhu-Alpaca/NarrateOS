id: dialogue-subtext
name: 对话潜台词与动作穿插
version: "1.0.0"
description: 强化对话场景中的意图错位、视线交互与器物动作穿插，避免平铺直叙的问答交代
applicable_roles:
  - planner
  - writer
prompt_injection: |
  [文风插件: 对话潜台词与动作穿插]
  - 意图错位: 每轮核心交锋先明确各说话方的真实诉求与顾虑, 使表面台词承担试探、回避或施压功能, 由上下文语境自然显露言外之意。
  - 动作穿插: 对话过程中穿插人物手部操作、身位移动、视线停顿或器物接触, 以物理节奏切分长段言语并标记主动权转移。
  - 节拍收束: 对话片段收尾落在具体的动作结果或立场微调上, 为后续情节留出可延续的因果接口。
enabled: true
