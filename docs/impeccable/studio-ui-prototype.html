<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NarrateOS 创作室 · Wave 4 满血清样剧场原型 v4</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  @property --beam-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .proto-stage {
    --bg-outer: #0c0d0f;
    --bg-host: #121316;
    --bg-side: #16171a;
    --bg-stage: #1a1b1e;
    --bg-sheet: #1f2024;
    --bg-elevated: #26282d;
    --bg-hover: rgba(255, 255, 255, 0.052);
    --bg-active: rgba(255, 255, 255, 0.09);

    --line-subtle: rgba(255, 255, 255, 0.068);
    --line-default: rgba(255, 255, 255, 0.125);
    --line-strong: rgba(255, 255, 255, 0.22);

    --ink-1: #f3f2ee;
    --ink-2: #c8c6bf;
    --ink-3: #98968f;
    --ink-4: #76746e;
    --ink-prose: #e6e2d8;

    --accent: #4c7cf0;
    --accent-fill: #3762cc;
    --accent-fill-hover: #436fd9;
    --accent-ink: #96b6ff;
    --accent-soft: rgba(76, 124, 240, 0.14);
    --accent-line: rgba(76, 124, 240, 0.4);

    --ok: #46c978;
    --ok-ink: #6ee098;
    --ok-soft: rgba(70, 201, 120, 0.14);

    --warn: #eba434;
    --warn-ink: #f5be62;
    --warn-soft: rgba(235, 164, 52, 0.13);
    --warn-line: rgba(235, 164, 52, 0.38);

    --danger: #e86565;
    --danger-ink: #f59393;
    --danger-soft: rgba(232, 101, 101, 0.12);
    --danger-line: rgba(232, 101, 101, 0.38);

    --seal: #df6447;
    --seal-soft: rgba(223, 100, 71, 0.11);
    --numeral-ink: #575853;
    --scrim: rgba(0, 0, 0, 0.44);

    --shadow-sheet: 0 6px 24px rgba(0, 0, 0, 0.14);
    --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.44), 0 2px 8px rgba(0, 0, 0, 0.24);
    --shadow-dock: 0 10px 30px rgba(0, 0, 0, 0.34);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-layout: cubic-bezier(0.2, 0.7, 0.2, 1);

    --font-serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", Georgia, serif;
    --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;

    color-scheme: dark;
    caret-color: var(--accent);
    width: 100%;
    height: 100%;
    background: var(--bg-outer);
    color: var(--ink-1);
    display: flex;
    flex-direction: column;
  }

  .proto-stage[data-theme="light"] {
    color-scheme: light;
    --bg-outer: #e4dfd5;
    --bg-host: #ece8df;
    --bg-side: #f2efe7;
    --bg-stage: #f8f5ee;
    --bg-sheet: #fcfbf7;
    --bg-elevated: #ffffff;
    --bg-hover: rgba(32, 28, 22, 0.048);
    --bg-active: rgba(32, 28, 22, 0.085);

    --line-subtle: rgba(32, 28, 22, 0.08);
    --line-default: rgba(32, 28, 22, 0.14);
    --line-strong: rgba(32, 28, 22, 0.24);

    --ink-1: #1e1c18;
    --ink-2: #48443d;
    --ink-3: #68635a;
    --ink-4: #847e73;
    --ink-prose: #26231e;

    --accent: #3566d6;
    --accent-fill: #2f5ec9;
    --accent-fill-hover: #2650b2;
    --accent-ink: #2450b5;
    --accent-soft: rgba(53, 102, 214, 0.11);
    --accent-line: rgba(53, 102, 214, 0.36);

    --ok: #1f9952;
    --ok-ink: #16703b;
    --ok-soft: rgba(31, 153, 82, 0.12);

    --warn: #cc7408;
    --warn-ink: #8a4b03;
    --warn-soft: rgba(204, 116, 8, 0.11);
    --warn-line: rgba(204, 116, 8, 0.36);

    --danger: #cf4242;
    --danger-ink: #a12525;
    --danger-soft: rgba(207, 66, 66, 0.09);
    --danger-line: rgba(207, 66, 66, 0.35);

    --seal: #c4452b;
    --seal-soft: rgba(196, 69, 43, 0.08);
    --numeral-ink: #bdb5a7;

    --shadow-sheet: 0 6px 22px rgba(36, 30, 20, 0.06);
    --shadow-float: 0 16px 38px rgba(36, 30, 20, 0.13), 0 2px 8px rgba(36, 30, 20, 0.06);
    --shadow-dock: 0 8px 26px rgba(36, 30, 20, 0.08);
  }

  .proto-stage ::selection { background: var(--accent-soft); }
  .proto-stage :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 7px; }
  .proto-stage ::-webkit-scrollbar { width: 6px; height: 6px; }
  .proto-stage ::-webkit-scrollbar-thumb { background: var(--line-default); border-radius: 999px; }
  .proto-stage ::-webkit-scrollbar-track { background: transparent; }

  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* 原生 View Transitions 共享元素流转 */
  ::view-transition-old(studio-sheet),
  ::view-transition-new(studio-sheet) {
    animation-duration: 210ms;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }
  ::view-transition-group(trace-lamp),
  ::view-transition-group(trace-role) {
    animation-duration: 260ms;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 顶部仿真预览栏（仅独立 HTML 演示器使用，正式挂载 DSH 时不渲染） */
  .sim-bar {
    min-height: 36px;
    padding: 4px 12px;
    background: var(--bg-host);
    color: var(--ink-2);
    border-bottom: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .sim-tag {
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--seal-soft);
    color: var(--seal);
    font-weight: 600;
    white-space: nowrap;
  }
  .sim-seg {
    display: inline-flex;
    background: var(--bg-hover);
    border-radius: 5px;
    padding: 2px;
    gap: 2px;
    white-space: nowrap;
  }
  .sim-seg button {
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .sim-seg button:hover { color: var(--ink-1); }
  .sim-seg button.on { background: var(--accent-fill); color: #ffffff; font-weight: 500; }
  .sim-action-btn {
    border: 1px solid var(--seal);
    background: var(--seal-soft);
    color: var(--seal);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .sim-action-btn:hover { background: var(--bg-active); color: var(--ink-1); }
  .sim-meta {
    margin-left: auto;
    color: var(--ink-3);
    font-family: var(--font-mono);
    font-size: 11px;
    white-space: nowrap;
  }

  .viewport-shell {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .dsh-app {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    background: var(--bg-stage);
    border-left: 1px solid var(--line-subtle);
    border-right: 1px solid var(--line-subtle);
    transition: max-width 0.22s var(--ease-layout), grid-template-columns 0.22s var(--ease-layout);
    overflow: hidden;
  }

  /* DSH 宿主左侧栏 */
  .host-rail {
    background: var(--bg-host);
    border-right: 1px solid var(--line-subtle);
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    user-select: none;
    overflow: hidden;
  }
  .host-brand-row {
    height: 32px;
    padding: 0 6px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-1);
  }
  .host-nav-btn {
    height: 32px;
    padding: 0 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-3);
    font-family: inherit;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .host-nav-btn:hover { background: var(--bg-hover); color: var(--ink-1); }
  .host-nav-btn.active { background: var(--bg-active); color: var(--ink-1); font-weight: 500; }
  .host-collapsed .host-txt { display: none; }
  .host-collapsed .host-brand-row,
  .host-collapsed .host-nav-btn { justify-content: center; padding: 0; }

  .studio-grid {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    transition: grid-template-columns 0.22s var(--ease-layout);
    position: relative;
    scroll-timeline: --manuscript-scroll y;
  }

  /* 通用按钮与徽标 */
  .btn {
    height: 30px;
    padding: 0 11px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
  }
  .btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--ink-1); }
  .btn-subtle { background: var(--bg-hover); color: var(--ink-1); }
  .btn-subtle:hover:not(:disabled) { background: var(--bg-active); }
  .btn-outline { border-color: var(--line-default); background: var(--bg-sheet); color: var(--ink-1); }
  .btn-outline:hover:not(:disabled) { border-color: var(--line-strong); background: var(--bg-elevated); }
  .btn-primary {
    background: var(--accent-fill);
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-fill-hover); color: #ffffff; }
  .btn-warn {
    background: var(--warn-soft);
    border-color: var(--warn-line);
    color: var(--warn-ink);
  }
  .btn-warn:hover:not(:disabled) { background: var(--bg-active); }
  .icon-only { width: 30px; padding: 0; justify-content: center; }

  .split-action {
    display: inline-flex;
    align-items: center;
    border-radius: 7px;
    position: relative;
  }
  .split-action > .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split-action > .btn:nth-child(2) {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    border-left: 1px solid rgba(255, 255, 255, 0.22);
    padding: 0 9px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok-soft); color: var(--ok-ink); }
  .badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
  .badge-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .badge-danger { background: var(--danger-soft); color: var(--danger-ink); }
  .badge-neutral { background: var(--bg-hover); color: var(--ink-3); }

  /* 浮层菜单（@starting-style 原生渐显，关闭快于打开） */
  .menu-pop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 244px;
    background: var(--bg-elevated);
    border: 1px solid var(--line-default);
    border-radius: 11px;
    box-shadow: var(--shadow-float);
    padding: 5px;
    z-index: 80;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.14s var(--ease-out), transform 0.14s var(--ease-out);
  }
  @starting-style {
    .menu-pop {
      opacity: 0;
      transform: translateY(-4px) scale(0.98);
    }
  }
  .menu-pop.left { right: auto; left: 0; }
  .menu-row {
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-1);
    font-family: inherit;
    font-size: 12.5px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
  }
  .menu-row:hover { background: var(--bg-hover); }
  .menu-row span { font-size: 11px; color: var(--ink-3); }
  .menu-row.danger { color: var(--danger-ink); }
  .menu-divider { height: 1px; background: var(--line-subtle); margin: 4px 4px; }

  /* 左栏 */
  .left-pane {
    background: var(--bg-side);
    border-right: 1px solid var(--line-subtle);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .left-vol-bar {
    height: 46px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 600;
  }
  .left-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 8px;
  }
  .left-group-label {
    padding: 4px 10px 6px;
    font-size: 11px;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
  }
  .ch-item {
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 2px;
  }
  .ch-item:hover { background: var(--bg-hover); color: var(--ink-1); }
  .ch-item.active { background: var(--bg-active); color: var(--ink-1); font-weight: 500; }
  .ch-title-wrap { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-no { color: var(--ink-3); margin-right: 4px; font-size: 11.5px; }
  .left-codex {
    padding: 10px 8px 12px;
    border-top: 1px solid var(--line-subtle);
  }
  .codex-row {
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .codex-row:hover { background: var(--bg-hover); color: var(--ink-1); }
  .codex-row.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }

  /* 中栏 */
  .center-pane {
    background: var(--bg-stage);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  .center-header {
    height: 46px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .book-switcher {
    border: 0;
    background: transparent;
    color: var(--ink-1);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 4px 8px;
    margin-left: -8px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .book-switcher:hover { background: var(--bg-hover); }

  /* 阅读工具栏 + 672px 版心光学对齐的 3x2 Agent 工序矩阵 */
  .reader-toolbar-wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .reader-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .seg-tabs {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--bg-side);
    padding: 3px;
    border-radius: 9px;
    border: 1px solid var(--line-subtle);
  }
  .seg-tab {
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease;
  }
  .seg-tab:hover { color: var(--ink-1); }
  .seg-tab.active {
    background: var(--bg-sheet);
    color: var(--ink-1);
    font-weight: 500;
  }

  .pipeline-toggle-btn {
    height: 31px;
    padding: 0 11px;
    border-radius: 9px;
    border: 1px solid var(--line-default);
    background: var(--bg-sheet);
    color: var(--ink-1);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .pipeline-toggle-btn:hover { border-color: var(--line-strong); background: var(--bg-elevated); }
  .pipeline-toggle-btn.open { border-color: var(--accent-line); background: var(--bg-elevated); }

  .lamp-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .lamp {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--line-strong);
    display: inline-block;
    flex-shrink: 0;
    transition: background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .lamp.done {
    background: var(--ok);
    border-color: var(--ok);
    box-shadow: 0 0 0 2px var(--ok-soft);
  }
  .lamp.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: lamp-breathe 1.8s ease-in-out infinite;
  }
  .lamp.halt {
    background: var(--danger);
    border-color: var(--danger);
    border-radius: 5px;
    transform: rotate(45deg) scale(0.88);
    box-shadow: 0 0 0 3px var(--danger-soft);
  }

  @keyframes lamp-breathe {
    0%, 100% { box-shadow: 0 0 0 2px var(--accent-soft); }
    50% { box-shadow: 0 0 0 5px var(--accent-soft); }
  }

  @keyframes beam-spin {
    to { --beam-angle: 360deg; }
  }

  /* Bolder + Animate 强化版 3x2 工序灯阵 */
  .pipeline-drawer {
    width: 100%;
    background: var(--bg-sheet);
    border: 1px solid var(--line-default);
    border-radius: 11px;
    padding: 9px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }
  .pipe-card {
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--line-subtle);
    background: var(--bg-side);
    color: var(--ink-1);
    font-family: inherit;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s var(--ease-out);
  }
  .pipe-card:hover { background: var(--bg-hover); border-color: var(--line-default); }
  .pipe-card.selected {
    background: var(--accent-soft);
    border-color: var(--accent-line);
  }
  /* 连写运行态激活卡片呼吸能量边框（CSS @property 驱动） */
  .pipe-card.running-live {
    background:
      linear-gradient(var(--bg-sheet), var(--bg-sheet)) padding-box,
      conic-gradient(from var(--beam-angle), var(--accent-line), rgba(76, 124, 240, 0.08) 42%, var(--accent) 78%, var(--accent-line)) border-box;
    border: 1px solid transparent;
    animation: beam-spin 3.6s linear infinite;
  }
  .pipe-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .pipe-step-name {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-1);
  }
  .pipe-step-state {
    font-size: 11px;
    color: var(--ink-3);
  }
  .pipe-card.running-live .pipe-step-state { color: var(--accent-ink); font-weight: 500; }
  .pipe-live-note {
    font-size: 11px;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

      inp.onkeydown = (e) => {
        if (e.key === 'Enter' && state.noteText.trim()) {

        }
      };

    if (fb) fb.oninput = (e) => { state.flashbackDay = Number(e.target.value) || 1; };

    if (sp) sp.onchange = (e) => { state.spotlightEntityId = e.target.value; };

    const pw = document.getElementById('par-win-inp');
    if (pw) pw.oninput = (e) => { state.parallelWindowId = e.target.value.trim() || 'win-dock-night'; };

    const ed = document.getElementById('editor-box');
    if (ed) ed.oninput = (e) => { state.draftBySlot[slotKey(state.bookKey, state.selectedCh)] = e.target.value; };

    document.querySelectorAll('[data-pool-model]').forEach(el => {
      el.oninput = (e) => {
        const pool = el.getAttribute('data-pool-model');
        state.poolModels[pool] = e.target.value;
        state.routingDirty = true;
      };
      el.onchange = () => render();
    });

    document.querySelectorAll('[data-role-tier]').forEach(el => {
      el.onchange = (e) => {
        const r = el.getAttribute('data-role-tier');
        state.roleOverrides[r] = Object.assign({}, state.roleOverrides[r], { tier: e.target.value });
        state.routingDirty = true;
        render();
      };
    });
    document.querySelectorAll('[data-role-effort]').forEach(el => {
      el.onchange = (e) => {
        const r = el.getAttribute('data-role-effort');
        state.roleOverrides[r] = Object.assign({}, state.roleOverrides[r], { effort: e.target.value });
        state.routingDirty = true;
        render();
      };
    });
    document.querySelectorAll('[data-role-model]').forEach(el => {
      el.oninput = (e) => {
        const r = el.getAttribute('data-role-model');
        state.roleOverrides[r] = Object.assign({}, state.roleOverrides[r], { model: e.target.value });
        state.routingDirty = true;
      };
      el.onchange = () => render();
    });
  }

  function pushNote(andRun) {
    const text = state.noteText.trim();
    if (!text) return;
    const book = BOOKS[state.bookKey];
    const kindLabel = (NOTE_KINDS.find(k => k.key === state.noteKind) || NOTE_KINDS[0]).label;
    let prefix = '';
    if (state.noteKind === 'FLASHBACK') {
      prefix = '（回到第 ' + state.flashbackDay + ' 天）';
    } else if (state.noteKind === 'SPOTLIGHT_TRIGGER') {
      const ent = book.codex.entities.find(e => e.id === state.spotlightEntityId) || book.codex.entities[0];
      if (ent) prefix = '（' + ent.name.split('（')[0] + '）';
    }
    state.notes.push({ kind: kindLabel, text: prefix + text });
    state.noteText = '';
    if (andRun) {
      state.scene = 'running';
      state.stopPending = false;
      showToast('已附上便签并开始写下一章');
    } else {
      showToast('便签已收好，写下一章时自动生效');
    }
    render();
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) {
      if (state.openMenu) { state.openMenu = null; render(); }
      return;
    }
    const act = btn.getAttribute('data-act');
    const book = BOOKS[state.bookKey];

    if (act === 'close-modal-bg' && e.target !== btn) return;
    if (act === 'close-modal' || act === 'close-modal-bg') { state.activeModal = null; render(); return; }

    if (act === 'vp') { state.vp = btn.getAttribute('data-v'); render(); return; }
    if (act === 'host') { state.hostCollapsed = btn.getAttribute('data-v') === '1'; render(); return; }
    if (act === 'toggle-host') { state.hostCollapsed = !state.hostCollapsed; render(); return; }
    if (act === 'scene') {
      withViewTransition(() => {
        state.scene = btn.getAttribute('data-v');
        state.stopPending = false;
        state.openMenu = null;
        render();
      });
      return;
    }
    if (act === 'demo-reveal') {
      state.mainSurface = 'chapter';
      state.chapterTab = 'prose';
      state.isEditing = false;
      state.scene = 'idle';
      if (state.bookKey === 'fresh') { state.bookKey = 'port'; state.selectedCh = 2; }
      BOOKS[state.bookKey].dirtyCount = 0;
      triggerInkAndSealReveal();
      showToast('已演示新章墨迹显影与朱砂定稿落印');
      return;
    }
    if (act === 'theme') { state.theme = btn.getAttribute('data-v'); render(); return; }
    if (act === 'menu') {
      const m = btn.getAttribute('data-m');
      state.openMenu = state.openMenu === m ? null : m;
      render();
      return;
    }
    if (act === 'toggle-pipeline') { state.pipelineExpanded = !state.pipelineExpanded; render(); return; }
    if (act === 'switch-book') {
      const next = btn.getAttribute('data-b');
      state.openMenu = null;
      const hadEdit = state.isEditing;
      withViewTransition(() => {
        state.isEditing = false;
        state.bookKey = next;
        const chs = BOOKS[next].chapters;
        state.selectedCh = chs.length ? chs[chs.length - 1].num : 1;
        state.mainSurface = 'chapter';
        render();
      });
      if (hadEdit) {
        showToast('已自动暂存《' + book.title + '》未保存手稿，切回可继续改');
      }
      return;
    }
    if (act === 'pick-ch') {
      const nextCh = Number(btn.getAttribute('data-ch'));
      const hadEdit = state.isEditing && nextCh !== state.selectedCh;
      withViewTransition(() => {
        state.isEditing = false;
        state.selectedCh = nextCh;
        state.mainSurface = 'chapter';
        state.openMenu = null;
        render();
      });
      if (hadEdit) showToast('已自动暂存上一章未保存手改草稿');
      return;
    }
    if (act === 'discard-stash') {
      delete state.draftBySlot[slotKey(state.bookKey, state.selectedCh)];
      showToast('已丢弃暂存手改，恢复定稿原文');
      return;
    }
    if (act === 'open-codex') {
      withViewTransition(() => {
        state.mainSurface = 'codex';
        state.codexTab = btn.getAttribute('data-tab');
        state.openMenu = null;
        render();
      });
      return;
    }
    if (act === 'codex-tab') { state.codexTab = btn.getAttribute('data-tab'); render(); return; }
    if (act === 'back-to-prose') {
      withViewTransition(() => { state.mainSurface = 'chapter'; render(); });
      return;
    }
    if (act === 'ch-tab') {
      withViewTransition(() => { state.chapterTab = btn.getAttribute('data-tab'); render(); });
      return;
    }
    if (act === 'r-tab') { state.rightTab = btn.getAttribute('data-tab'); render(); return; }
    if (act === 'toggle-right') { state.rightOpen = !state.rightOpen; render(); return; }
    if (act === 'toggle-lowlevel') { state.lowLevelOpen = !state.lowLevelOpen; render(); return; }
    if (act === 'pick-attempt') { state.traceAttempt = btn.getAttribute('data-att'); render(); return; }
    if (act === 'open-patch-trace') {
      withViewTransition(() => {
        state.selectedRoleForTrace = 'writer';
        state.traceAttempt = 'patch';
        state.rightOpen = true;
        state.rightTab = 'trace';
        render();
      });
      return;
    }
    if (act === 'inspect-step') {
      withViewTransition(() => {
        state.selectedRoleForTrace = btn.getAttribute('data-role');
        state.traceAttempt = 'writer';
        state.rightOpen = true;
        state.rightTab = 'trace';
        render();
      });
      return;
    }
    if (act === 'toggle-ideas') { state.ideasExpanded = !state.ideasExpanded; render(); return; }
    if (act === 'fill-idea') {
      state.noteText = book.options[Number(btn.getAttribute('data-idx'))] || '';
      state.noteKind = 'DIRECTOR_NOTE';
      render();
      const inp = document.getElementById('note-input');
      if (inp) inp.focus();
      return;
    }
    if (act === 'run-idea' || act === 'run-one' || act === 'start-cont') {
      state.openMenu = null;
      state.scene = 'running';
      state.stopPending = false;
      state.selectedRoleForTrace = 'writer';
      showToast('已启动章节生成管线');
      return;
    }
    if (act === 'soft-stop') {
      state.openMenu = null;
      state.stopPending = true;
      showToast('将在本章写完保存后平稳停下');
      return;
    }
    if (act === 'force-stop') {
      state.openMenu = null;
      state.scene = 'idle';
      state.stopPending = false;
      showToast('已立即中断并清理未完成半截草稿');
      return;
    }
    if (act === 'pick-kind') {
      state.noteKind = btn.getAttribute('data-k');
      state.openMenu = null;
      render();
      return;
    }
    if (act === 'add-note') { pushNote(false); return; }
    if (act === 'send-run') { pushNote(true); return; }
    if (act === 'del-note') {
      state.notes.splice(Number(btn.getAttribute('data-idx')), 1);
      showToast('已撤回便签');
      return;
    }
    if (act === 'toggle-edit') { state.chapterTab = 'prose'; state.isEditing = !state.isEditing; render(); return; }
    if (act === 'save-edit' || act === 'sync-now') {
      state.isEditing = false;
      delete state.draftBySlot[slotKey(state.bookKey, state.selectedCh)];
      book.dirtyCount = 0;
      state.scene = 'idle';
      triggerInkAndSealReveal();
      showToast('已保存手改并同步全书设定集，重新加盖定稿印');
      return;
    }
    if (act === 'auto-heal') {
      state.scene = 'idle';
      triggerInkAndSealReveal();
      showToast('已自动修补冲突语句并更新本章台账');
      return;
    }
    if (act === 'retry-with-note') {
      state.notes.push({ kind: '圆谎修补', text: '陈砚护着旧伤未愈的左腕，改用右肩抵开账房木门' });
      state.scene = 'running';
      showToast('已附修正便签并重新启动本章执笔');
      return;
    }
    if (act === 'fill-retcon') {
      state.noteKind = 'RETCON';
      state.noteText = '补圆左腕伤势：陈砚用右肩抵门，左手仅虚扶门框';
      render();
      const inp = document.getElementById('note-input');
      if (inp) inp.focus();
      return;
    }
    if (act === 'toggle-role') {
      const r = btn.getAttribute('data-role');
      state.expandedRoles[r] = !state.expandedRoles[r];
      render();
      return;
    }
    if (act === 'toggle-all-roles') {
      const next = !ROLES.every(r => state.expandedRoles[r.id]);
      ROLES.forEach(r => { state.expandedRoles[r.id] = next; });
      render();
      return;
    }
    if (act === 'save-routing') { state.routingDirty = false; showToast('第一层基础池与第二层单 Agent 覆盖已一并保存'); return; }
    if (act === 'dream-now') { state.openMenu = null; showToast('已启动跨章设定与伏笔整理'); return; }
    if (act === 'harvest-voice') { state.openMenu = null; showToast('已从本章提取鲜活对话声纹标本'); return; }
    if (act === 'next-vol') { state.openMenu = null; state.activeModal = 'volume'; render(); return; }
    if (act === 'parallel-fork') { state.openMenu = null; state.activeModal = 'parallel'; render(); return; }
    if (act === 'new-book') { state.openMenu = null; state.activeModal = 'boot'; render(); return; }
    if (act === 'confirm-vol') {
      const doneBook = btn.getAttribute('data-complete') === '1';
      state.activeModal = null;
      showToast(doneBook ? '已封存全书并打上完结标签' : '已封存本卷并生成下一卷大纲');
      return;
    }
    if (act === 'confirm-parallel-fork') {
      state.activeModal = null;
      state.parallelActive = true;
      showToast('已开启多线并行窗口：' + state.parallelWindowId);
      return;
    }
    if (act === 'confirm-parallel-merge') {
      state.activeModal = null;
      state.parallelActive = false;
      showToast('已将并行支线合流回主线时间轴');
      return;
    }
    if (act === 'confirm-boot') {
      state.activeModal = null;
      state.bookKey = 'fresh';
      state.mainSurface = 'chapter';
      showToast('新作品《灰烬航路》建库完成，已停机待命');
      return;
    }
  });

  window.addEventListener('resize', () => {
    if (state.vp === 'full') render();
  });

  render();
})();
</script>
</body>
</html>
