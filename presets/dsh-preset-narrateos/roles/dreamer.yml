id: dreamer
pool: strong_creative
cleanroom: false
promptFile: ./prompts/dreamer.md
temperature: 0.3
reasoningEffort: high
maxSteps: 10
maxReadCalls: 12
tools:
    - book_read
    - book_grep
    - book_glob
    - book_edit
allowedOpsRead:
    - .ops/voice_samples.yaml
    - .ops/signals.jsonl
    - .ops/telemetry.jsonl
allowedOpsWrite:
    - .ops/voice_samples.yaml
yieldTool: yield_dream_commit
